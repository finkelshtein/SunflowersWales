# Navigation Links
#   The weight parameter defines the order that the links will appear in.
#   `parent: <name>` nests an entry under the top-level entry with that
#   name, rendering it as a dropdown (see layouts/_partials/components/
#   headers/navbar.html's `.HasChildren` branch).
#
#   "Home" was dropped as its own entry — the navbar logo already links
#   to the home page (see navbar.html), so it was a redundant second link
#   to the same place.

main:
  - name: Donate
    url: donate/
    weight: 10
  - name: Shipments
    url: shipments/
    weight: 20

  - name: Events
    weight: 30
  - name: Fundraising events
    url: fundraising/
    parent: Events
    weight: 31
  - name: Social events
    url: events/
    parent: Events
    weight: 32
  # These three are all subsets of Social events (filtered by tag, not
  # a separate folder — see layouts/_partials/tag-collection-list.html)
  # — `params.nested: true` gets them a visual indent/connector under
  # it in the dropdown (navbar.html), without an actual sub-submenu:
  # there are Social events outside all three, so nesting them for real
  # would misrepresent Social events as just a container for these.
  - name: Children's classes
    url: classes/
    parent: Events
    weight: 33
    params:
      nested: true
  - name: Family activities
    url: family-activities/
    parent: Events
    weight: 34
    params:
      nested: true
  - name: Day trips
    url: day-trips/
    parent: Events
    weight: 35
    params:
      nested: true

  - name: About us
    weight: 40
  - name: Who we are
    url: about/
    parent: About us
    weight: 41
  - name: Dancing group
    url: dancing/
    parent: About us
    weight: 43
  - name: Funding
    url: funding/
    parent: About us
    weight: 44
  - name: Reports
    url: reports/
    parent: About us
    weight: 45

  - name: Gallery
    url: gallery/
    weight: 50
