# ══════════════════════════════════════════════════════════════════════════════
# HUGOBLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# Documentation: https://docs.hugoblox.com/
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    name: "Sunflowers Wales"
    organization: "Sunflowers Wales"
    type: organization # person | organization | local_business
    tagline: "Sending aid to Ukraine and strengthening Ukrainian community and culture in Wales"
    description: "A non-profit community group founded by Ukrainian volunteers in Wales to support Ukrainians affected by Russia's invasion of Ukraine."
    social:
      twitter: "sunflowerswales"

  # ────────────────────────────────────────────────────────────────────────────
  # THEME — "Community Warmth": warm terracotta + sunflower gold, not a
  # literal flag palette — chosen from the three redesign previews
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    mode: light # light | dark | system
    pack: "default"
    colors:
      primary: "#c2410c"   # Warm terracotta
      secondary: "#f2b705" # Sunflower gold
      neutral: "#78716c"   # Warm gray (ramp seed for borders/muted text — NOT the page background)
    # `colors.neutral` seeds a gray-tone ramp, it does not set the page background.
    # The actual page background/text colors are `surfaces` — a near-white seed there
    # produced a broken, washed-out ramp with illegible headings (fixed here).
    surfaces:
      background: "#fdf6ec" # Warm cream (the actual page background)
      foreground: "#2b2015" # Dark warm brown-black (body/heading text)
      header:
        background: "#faf0dc"
        foreground: "#2b2015"
      footer:
        background: "#f3e6d0"
        foreground: "#2b2015"

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY — System: zero external font requests, fastest load, crisp
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    pack: "system"

  # ────────────────────────────────────────────────────────────────────────────
  # LAYOUT
  # ────────────────────────────────────────────────────────────────────────────
  layout:
    radius: "sm" # none | sm | md | lg | full
    spacing: "compact" # compact | comfortable | spacious
    avatar_shape: circle # circle | square | rounded

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    show_logo: true
    show_title: false # logo image (assets/media/logo.png) replaces the "Sunflowers Wales" text

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER
  # ────────────────────────────────────────────────────────────────────────────
  footer:
    style: minimal

  # ────────────────────────────────────────────────────────────────────────────
  # COPYRIGHT
  # ────────────────────────────────────────────────────────────────────────────
  copyright:
    notice: "© {year} Sunflowers Wales"

  # ────────────────────────────────────────────────────────────────────────────
  # CONTENT
  # ────────────────────────────────────────────────────────────────────────────
  content:
    math:
      enable: false
    toc:
      enable: false
    reading_time:
      enable: false

  # ────────────────────────────────────────────────────────────────────────────
  # SEARCH
  # ────────────────────────────────────────────────────────────────────────────
  search:
    enable: true

  # ────────────────────────────────────────────────────────────────────────────
  # LOCALE
  # ────────────────────────────────────────────────────────────────────────────
  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
